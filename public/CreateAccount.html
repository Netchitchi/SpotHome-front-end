<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Criação de conta</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">
  <div class = "imagem">
    <img src="https://i.pinimg.com/736x/86/dd/85/86dd85f606d59b007b87854bb31fa19a.jpg" alt="imagem da casa">
  </div>
  <div class = "CreateAccount">
    <div class="login-form">
      <h1>Create Account</h1>
    </div >
    <div class = labelinput>
      <label for="name">Name</label>
      <input id="name" placeholder="Enter your firstname and lastname" required>

      <label for="phone">Phone Number</label>
      <input id="phone" placeholder="Enter your phone number" required>

      <label for="email">Email Address</label>
      <input id="email" placeholder="Enter your email address" required>

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter your password" required>

      <div class = "button">
        <button type = "button">Sign up</button>
      </div>
    </div>
  </div>
</div>

</body>

</html>
